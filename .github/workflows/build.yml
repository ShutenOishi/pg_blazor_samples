name: 日本語Blazorアプリのビルドと画面疎通

on:
  push:
    branches: [main]
    paths:
      - "PgBlazorSamples.slnx"
      - "Directory.Build.props"
      - "global.json"
      - "src/**"
      - "docs/samples/**"
      - "scripts/smoke-test.sh"
      - "scripts/check-learning-materials.py"
      - "scripts/browser-smoke.cjs"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "PgBlazorSamples.slnx"
      - "Directory.Build.props"
      - "global.json"
      - "src/**"
      - "docs/samples/**"
      - "scripts/smoke-test.sh"
      - "scripts/check-learning-materials.py"
      - "scripts/browser-smoke.cjs"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} Releaseビルド
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: .NET 10を用意
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 依存関係を復元
        run: dotnet restore PgBlazorSamples.slnx
      - name: 5ステップごとの学習コラムとPDF索引を検査
        run: python scripts/check-learning-materials.py
      - name: Releaseビルド
        run: dotnet build PgBlazorSamples.slnx -c Release --no-restore
      - name: 日本語画面をHTTPで確認
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke-test.sh
      - name: 日本語フォントを導入し、日本語グリフを確認
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match :lang=ja | grep -E 'Noto Sans CJK JP|Noto Serif CJK JP'

      - name: Chromeのパスを確認
        if: runner.os == 'Linux'
        shell: bash
        run: command -v google-chrome || command -v chromium

      - name: 実ブラウザー検証ライブラリを導入
        if: runner.os == 'Linux'
        shell: bash
        run: npm --prefix scripts install --no-save --no-package-lock playwright-core@1.56.1

      - name: 日本語UIのクリックと双方向入力を実ブラウザーで確認
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/browser-smoke.cjs

      - name: 画面操作の証跡画像を保存
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-blazor-ui-browser-screenshots
          path: dist/browser-evidence/
          if-no-files-found: ignore

      - name: Release発行を確認
        run: dotnet publish src/PgBlazorSamples.Web/PgBlazorSamples.Web.csproj -c Release --no-build -o publish-output
