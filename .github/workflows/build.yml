name: 日本語Blazorアプリのビルドと画面疎通

on:
  push:
    branches: [main]
    paths:
      - "PgBlazorSamples.slnx"
      - "Directory.Build.props"
      - "global.json"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "docs/samples/**"
      - "docs/columns/**"
      - "docs/course-v3/**"
      - "scripts/smoke-test.sh"
      - "scripts/check-learning-materials.py"
      - "scripts/audit-source-trace.py"
      - "scripts/browser-smoke.cjs"
      - "scripts/browser-circuit-smoke.cjs"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "PgBlazorSamples.slnx"
      - "Directory.Build.props"
      - "global.json"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "docs/samples/**"
      - "docs/columns/**"
      - "docs/course-v3/**"
      - "scripts/smoke-test.sh"
      - "scripts/browser-smoke.cjs"
      - "scripts/browser-circuit-smoke.cjs"
      - "scripts/audit-source-trace.py"
      - "scripts/check-learning-materials.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} Releaseビルド
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: .NET 10を用意
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 依存関係を復元
        run: dotnet restore PgBlazorSamples.slnx
      - name: 5ステップごとの学習コラムとPDF索引を検査
        run: python scripts/check-learning-materials.py
      - name: 学習順110件のC#・SQL・JS・テスト参照の監査レポートを作成
        if: runner.os == 'Linux'
        run: python scripts/audit-source-trace.py --report dist/source-dependency-trace.json
      - name: 依存参照監査レポートを保存
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: course-v3-source-trace-110
          path: dist/source-dependency-trace.json
          if-no-files-found: error
      - name: Releaseビルド
        run: dotnet build PgBlazorSamples.slnx -c Release --no-restore
      - name: UnitTestsの単体テストを実行
        run: dotnet test tests/PgBlazorSamples.UnitTests/PgBlazorSamples.UnitTests.csproj -c Release --no-build
      - name: 公式テンプレートからInteractive Server練習アプリを生成してビルド
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet new install MudBlazor.Templates::4.3.0
          dotnet new mudblazor --name MudBlazorPractice --output "$RUNNER_TEMP/mudblazor-practice" --interactivity Server --all-interactive --empty --no-restore
          dotnet build "$RUNNER_TEMP/mudblazor-practice/MudBlazorPractice.csproj" -c Release
      - name: 日本語画面をHTTPで確認
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke-test.sh
      - name: 日本語フォントを導入し、日本語グリフを確認
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # ブラウザー試験で必要な日本語グリフを確認する。Ubuntuミラーの通信遅延で
          # IPAフォント取得が120秒を超えた事例に対応し、ダウンロードの再試行と
          # 取得猶予を確保する。フォント未導入のまま画面試験を成功扱いしない。
          if ! fc-list :lang=ja family | grep -Eiq 'Noto.*CJK|IPA'; then
            sudo timeout 180s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo timeout 300s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-ipafont-gothic
            timeout 60s fc-cache -f
          fi
          # fc-matchは優先書体を一つ返すだけ。導入フォントの有無はfc-listで調べる。
          fc-list :lang=ja family | grep -Ei 'Noto.*CJK|IPA'

      - name: Chromeのパスを確認
        if: runner.os == 'Linux'
        shell: bash
        run: command -v google-chrome || command -v chromium

      - name: 実ブラウザー検証ライブラリを導入
        if: runner.os == 'Linux'
        shell: bash
        run: npm --prefix scripts install --no-save --no-package-lock playwright-core@1.56.1

      - name: 日本語UIのクリックと双方向入力を実ブラウザーで確認
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/browser-smoke.cjs

      - name: 学習順015の隔離WebSocket切断・再接続をChromeで検証
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/browser-circuit-smoke.cjs

      - name: 画面操作の証跡画像を保存
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-blazor-ui-browser-screenshots
          path: dist/browser-evidence/
          if-no-files-found: ignore

      - name: Release発行を確認
        run: dotnet publish src/PgBlazorSamples.Web/PgBlazorSamples.Web.csproj -c Release --no-build -o publish-output

  postgres18:
    name: PostgreSQL 18 実DB結合テスト
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pg_blazor_learning
          POSTGRES_USER: pgblazor_learning
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgblazor_learning -d pg_blazor_learning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: pgblazor_learning
      PGPASSWORD: local-ci-test-only
      PGDATABASE: pg_blazor_learning
      ConnectionStrings__PostgreSQL: Host=127.0.0.1;Port=5432;Database=pg_blazor_learning;Username=pgblazor_learning;Password=local-ci-test-only
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: .NET 10を用意
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: PostgreSQLのクライアントを準備
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: 専用DBへDDLと架空データを適用
        run: |
          psql -v ON_ERROR_STOP=1 -f database/schema/001_learning_task.sql
          psql -v ON_ERROR_STOP=1 -f database/schema/002_app_access.sql
          psql -v ON_ERROR_STOP=1 -f database/schema/003_learning_audit.sql
          psql -v ON_ERROR_STOP=1 -f database/seed/001_learning_task.sql
      - name: date・time・daterange・multirange・xminのSQLを確認
        run: psql -v ON_ERROR_STOP=1 -f database/tests/001_learning_task_check.sql
      - name: PostgreSQL 18へのEF Core実接続・更新競合・ロールバック
        run: dotnet test tests/PgBlazorSamples.UnitTests/PgBlazorSamples.UnitTests.csproj -c Release --filter "FullyQualifiedName~LearningDbIntegrationTests|FullyQualifiedName~LearningAdvancedIntegrationTests|FullyQualifiedName~LearningEditIntegrationTests|FullyQualifiedName~LearningFinalIntegrationTests|FullyQualifiedName~WindowsAccessIntegrationTests|FullyQualifiedName~SecuredLearningIntegrationTests|FullyQualifiedName~DbBridgeIntegrationTests|FullyQualifiedName~L046OrmComparisonTests|FullyQualifiedName~L053PersistenceComparisonTests|FullyQualifiedName~L058KeylessViewTests|FullyQualifiedName~CapstoneIntegrationTests"
