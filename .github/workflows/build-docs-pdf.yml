name: 日本語ドキュメントPDF生成

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "scripts/build_docs_pdf.py"
      - "scripts/check-learning-materials.py"
      - ".github/workflows/build-docs-pdf.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "scripts/build_docs_pdf.py"
      - ".github/workflows/build-docs-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-24.04
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Pythonを用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 日本語フォントと描画依存を導入
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          for name in fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0; do
            if ! dpkg-query -W -f='${Status}' "$name" 2>/dev/null | grep -q 'install ok installed'; then
              packages+=("$name")
            fi
          done
          if (( ${#packages[@]} > 0 )); then
            sudo timeout 150s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo timeout 150s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y "${packages[@]}"
          fi
          fc-match :lang=ja | grep -E 'Noto Sans CJK JP|Noto Serif CJK JP'
      - name: PDF生成ライブラリを導入
        run: python -m pip install "weasyprint==66.0" "markdown-it-py==4.0.0" "pypdf==6.1.1"
      - name: 5ステップごとの学習コラムの漏れを検査
        run: python scripts/check-learning-materials.py
      - name: ソースと同期した日本語PDFを生成
        run: python scripts/build_docs_pdf.py
      - name: PDF生成を検査
        run: |
          test -s dist/blazor_learning_textbook_ja.pdf
          test -s dist/blazor_learning_source_manifest.json
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/blazor_learning_textbook_ja.pdf")
          assert p.read_bytes()[:5] == b"%PDF-"
          print(f"生成PDFのサイズ: {p.stat().st_size} bytes")
          from pypdf import PdfReader
          from pathlib import Path
          reader = PdfReader(str(p))
          content = "\n".join(page.extract_text() or "" for page in reader.pages)
          for phrase in ("レポジトリ", "github.com", "README.md", "src/PgBlazorSamples.Web"):
              assert phrase not in content, f"学習者向けPDFに開発情報が混在しています: {phrase}"
          assert "ステップ15：injectとコンストラクター注入" in content
          assert "学習コラム03：DIとサービスの寿命" in content
          assert "ステップ20：DIで課題管理を作る" in content
          assert "学習コラム04：設定とサービス分離" in content
          assert "特別コラム05：ライブラリが提供するDI" in content
          assert "ステップ21：MudBlazorと日本語翻訳を導入する" in content
          assert "ステップ25：MudTableで一覧とソート" in content
          assert "学習コラム06：MudBlazorのDIと翻訳" in content
          assert "ステップ46：関連テーブルをDTOへ射影する" in content
          assert "ステップ47：キーセットページングを理解する" in content
          assert "ステップ48：取得済み一覧を部分描画する" in content
          assert "ステップ49：DB取得と仮想スクロールを連携する" in content
          assert "ステップ50：デバウンスと障害時の再試行" in content
          assert "学習コラム11：関連DTO・キーセット・仮想化" in content
          assert "ステップ51：編集DTOをフォームで検証して保存する" in content
          assert "ステップ52：ダイアログで保存と取消を分ける" in content
          assert "ステップ53：複数選択と原子的な一括処理" in content
          assert "ステップ54：xmin競合と最新値の確認" in content
          assert "ステップ55：詳細DTOとN+1の防止" in content
          assert "学習コラム12：編集・一括処理・競合・詳細" in content
          assert "ステップ56：日本語日付範囲とDB検索" in content
          assert "ステップ57：キャッシュと権限境界" in content
          assert "ステップ58：DB側集計とCSV出力" in content
          assert "ステップ59：EXPLAINと応答時間計測" in content
          assert "ステップ60：一覧パターンを要件から選ぶ" in content
          assert "学習コラム13：期間検索・集計・性能・選定" in content
          assert "ステップ61：Windows統合認証を構成する" in content
          assert "ステップ62：認証済みドメインユーザー名を扱う" in content
          assert "ステップ63：認証済みユーザー名と既存台帳を結ぶ" in content
          assert "ステップ64：未登録・無効利用者を拒否する" in content
          assert "ステップ65：既存台帳の業務権限を確認する" in content
          assert "学習コラム14：認証と認可の分離" in content
          assert "ステップ66：サービス側で認可を強制する" in content
          assert "ステップ67：部署ごとのCountとItems" in content
          assert "ステップ68：集計とCSVにも認可を適用" in content
          assert "ステップ69：保存直前の権限とxminを再確認" in content
          assert "ステップ70：Windows Server 2025の実機受入を分ける" in content
          assert "ステップ71：既存台帳のキー正規化・重複拒否と索引" in content
          assert "ステップ72：明示Windowsログインと短命Cookie" in content
          assert "ステップ73：権限行ロックと更新の原子性" in content
          assert "ステップ74：本人・操作・結果を永続監査する" in content
          assert "学習コラム15：業務データを守る認可の強制" in content
          assert "特別コラム：1万人規模の認証・既存台帳認可・セッション・監査" in content
          print(f"学習者向け日本語PDFの内容確認: {len(reader.pages)}ページ")
          PY
      # Actions Artifactは自動でZIPになるため学習者配布に使用しない。
      # mainの成功ビルドだけを直接PDFのRelease assetとして公開する。
      - name: PDFをZIP化せずGitHub Releaseで配布
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view learning-textbook >/dev/null 2>&1; then
            gh release create learning-textbook --target "$GITHUB_SHA" \
              --title "Blazor実践学習テキスト（PDF単体・最新版）" \
              --notes "最新mainの検査済み日本語PDFをZIP化せず提供します。" \
              --latest=false
          fi
          gh release upload learning-textbook dist/blazor_learning_textbook_ja.pdf --clobber
          gh release edit learning-textbook \
            --notes "日本語PDF単体配布。PDFの生成元コミット: $GITHUB_SHA" \
            --latest=false
          gh release view learning-textbook --json assets --jq '.assets[].name' | grep -Fx 'blazor_learning_textbook_ja.pdf'
