name: 日本語ドキュメントPDF生成

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "scripts/build_docs_pdf.py"
      - "scripts/check-learning-materials.py"
      - "scripts/check-learning-materials.py"
      - ".github/workflows/build-docs-pdf.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "scripts/build_docs_pdf.py"
      - ".github/workflows/build-docs-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-24.04
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Pythonを用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 日本語フォントと描画依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
      - name: PDF生成ライブラリを導入
        run: python -m pip install "weasyprint==66.0" "markdown-it-py==4.0.0"
      - name: 5ステップごとの学習コラムの漏れを検査
        run: python scripts/check-learning-materials.py
      - name: ソースと同期した日本語PDFを生成
        run: python scripts/build_docs_pdf.py
      - name: PDF生成を検査
        run: |
          test -s dist/pg_blazor_samples_technical_handbook.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/pg_blazor_samples_technical_handbook.pdf")
          assert p.read_bytes()[:5] == b"%PDF-"
          print(f"生成PDFのサイズ: {p.stat().st_size} bytes")
          PY
      - name: PDFをダウンロード可能な成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: pg_blazor_samples_technical_handbook
          path: dist/pg_blazor_samples_technical_handbook.pdf
          retention-days: 30
