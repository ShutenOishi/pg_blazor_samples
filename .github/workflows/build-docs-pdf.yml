name: 日本語ドキュメントPDF生成

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "scripts/build_docs_pdf.py"
      - "scripts/check-learning-materials.py"
      - ".github/workflows/build-docs-pdf.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "scripts/build_docs_pdf.py"
      - ".github/workflows/build-docs-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-24.04
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Pythonを用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 日本語フォントと描画依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
      - name: PDF生成ライブラリを導入
        run: python -m pip install "weasyprint==66.0" "markdown-it-py==4.0.0" "pypdf==6.1.1"
      - name: 5ステップごとの学習コラムの漏れを検査
        run: python scripts/check-learning-materials.py
      - name: ソースと同期した日本語PDFを生成
        run: python scripts/build_docs_pdf.py
      - name: PDF生成を検査
        run: |
          test -s dist/blazor_learning_textbook_ja.pdf
          test -s dist/blazor_learning_source_manifest.json
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/blazor_learning_textbook_ja.pdf")
          assert p.read_bytes()[:5] == b"%PDF-"
          print(f"生成PDFのサイズ: {p.stat().st_size} bytes")
          from pypdf import PdfReader
          from pathlib import Path
          reader = PdfReader(str(p))
          content = "\n".join(page.extract_text() or "" for page in reader.pages)
          for phrase in ("レポジトリ", "github.com", "README.md", "src/PgBlazorSamples.Web"):
              assert phrase not in content, f"学習者向けPDFに開発情報が混在しています: {phrase}"
          assert "ステップ15：injectとコンストラクター注入" in content
          assert "学習コラム03：DIとサービスの寿命" in content
          assert "ステップ20：DIで課題管理を作る" in content
          assert "学習コラム04：設定とサービス分離" in content
          assert "特別コラム05：ライブラリが提供するDI" in content
          assert "ステップ21：MudBlazorと日本語翻訳を導入する" in content
          assert "ステップ25：MudTableで一覧とソート" in content
          assert "学習コラム06：MudBlazorのDIと翻訳" in content
          assert "ステップ46：関連テーブルをDTOへ射影する" in content
          assert "ステップ47：キーセットページングを理解する" in content
          assert "ステップ48：取得済み一覧を部分描画する" in content
          assert "ステップ49：DB取得と仮想スクロールを連携する" in content
          assert "ステップ50：デバウンスと障害時の再試行" in content
          assert "学習コラム11：関連DTO・キーセット・仮想化" in content
          assert "ステップ51：編集DTOをフォームで検証して保存する" in content
          assert "ステップ52：ダイアログで保存と取消を分ける" in content
          assert "ステップ53：複数選択と原子的な一括処理" in content
          assert "ステップ54：xmin競合と最新値の確認" in content
          assert "ステップ55：詳細DTOとN+1の防止" in content
          assert "学習コラム12：編集・一括処理・競合・詳細" in content
          assert "ステップ56：日本語日付範囲とDB検索" in content
          assert "ステップ57：キャッシュと権限境界" in content
          assert "ステップ58：DB側集計とCSV出力" in content
          assert "ステップ59：EXPLAINと応答時間計測" in content
          assert "ステップ60：一覧パターンを要件から選ぶ" in content
          assert "学習コラム13：期間検索・集計・性能・選定" in content
          assert "ステップ61：Windows統合認証を構成する" in content
          assert "ステップ62：認証済みSIDを扱う" in content
          assert "ステップ63：ADのSIDとDB利用者を結ぶ" in content
          assert "ステップ64：未登録・無効利用者を拒否する" in content
          assert "ステップ65：ロールと許可コードを確認する" in content
          assert "学習コラム14：認証と認可の分離" in content
          print(f"学習者向け日本語PDFの内容確認: {len(reader.pages)}ページ")
          PY
      - name: PDFをダウンロード可能な成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: blazor_learning_textbook_ja
          path: dist/blazor_learning_textbook_ja.pdf
          retention-days: 30
