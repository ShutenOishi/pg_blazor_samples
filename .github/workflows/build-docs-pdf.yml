name: 日本語ドキュメントPDF生成

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "scripts/build_docs_pdf.py"
      - "scripts/check-learning-materials.py"
      - ".github/workflows/build-docs-pdf.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "database/**"
      - "scripts/build_docs_pdf.py"
      - ".github/workflows/build-docs-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    # 教材v3 Draft PR #36はユーザーの明示的な再開指示までPDFを生成しない。
    # CIの教材整合検査は別のアプリWorkflowで継続する。
    # mainの正式Release工程や他のPRの既存挙動は変更しない。
    if: github.event_name != 'pull_request' || github.event.pull_request.number != 36
    runs-on: ubuntu-24.04
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Pythonを用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 日本語フォントと描画依存を導入
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          for name in fonts-ipafont-gothic libpango-1.0-0 libpangocairo-1.0-0; do
            if ! dpkg-query -W -f='${Status}' "$name" 2>/dev/null | grep -q 'install ok installed'; then
              packages+=("$name")
            fi
          done
          if (( ${#packages[@]} > 0 )); then
            # GitHub-hosted UbuntuのAzureミラーが少容量のフォントでも固まる場合がある。
            # 公開のUbuntu公式ミラーへ切り替え、転送に上限を設ける。
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
            fi
            sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y "${packages[@]}"
          fi
          fc-list :lang=ja family | grep -Ei 'Noto.*CJK|IPA'
      - name: PDF生成ライブラリを導入
        run: python -m pip install "weasyprint==66.0" "markdown-it-py==4.0.0" "pypdf==6.1.1"
      - name: 5ステップごとの学習コラムの漏れを検査
        run: python scripts/check-learning-materials.py
      - name: ソースと同期した日本語PDFを生成
        run: python scripts/build_docs_pdf.py
      - name: PDF生成を検査
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/blazor_learning_textbook_ja.pdf
          test -s dist/blazor_learning_source_manifest.json
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          from pypdf import PdfReader
          
          pdf_path = Path("dist/blazor_learning_textbook_ja.pdf")
          manifest_path = Path("dist/blazor_learning_source_manifest.json")
          curriculum_path = Path("docs/course-v3/curriculum.json")
          assert pdf_path.read_bytes().startswith(b"%PDF-"), "PDFマジック不正"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          curriculum = json.loads(curriculum_path.read_text(encoding="utf-8"))
          steps, stages, reviews = curriculum["steps"], curriculum["stages"], curriculum["reviews"]
          assert len(steps) == 110, f"学習順が110本ではありません: {len(steps)}"
          assert len(stages) == 9, f"段階概要が9本ではありません: {len(stages)}"
          assert len(reviews) == 22, f"通常復習が22本ではありません: {len(reviews)}"
          assert [s["sequence"] for s in steps] == list(range(1, 111)), "学習順が欠落・重複"
          assert all(s.get("rewrite") == "final-reviewed-ci-passed" for s in steps), "全面改稿未確定"
          chapters = manifest["chapters"]
          sources = {c["path"] for c in chapters}
          required = ({s["source"] for s in steps} |
                      {s["overview"] for s in stages} |
                      {r["path"] for r in reviews} |
                      {s["source"] for s in curriculum["specials"]})
          missing = sorted(required - sources)
          assert not missing, f"PDFの収録元に欠落: {missing}"
          assert len(chapters) >= 141, f"PDFの章数が不足: {len(chapters)}"
          for chapter in chapters:
              actual = hashlib.sha256(Path(chapter["path"]).read_bytes()).hexdigest()
              assert actual == chapter["sha256"], f"ソースSHA256不一致: {chapter['path']}"
          reader = PdfReader(str(pdf_path))
          content = "\n".join(page.extract_text() or "" for page in reader.pages)
          compact = lambda text: re.sub(r"\s+", "", text)
          compact_text = compact(content)
          for phrase in ("レポジトリ", "github.com", "README.md", "src/PgBlazorSamples.Web"):
              assert phrase not in content, f"学習者向けPDFに開発情報が混在: {phrase}"
          missing_titles = [c["title"] for c in chapters if compact(c["title"]) not in compact_text]
          assert not missing_titles, f"PDF本文/目次から章見出しが欠落: {missing_titles[:8]}"
          assert len(reader.pages) >= 110, f"PDFページ数が少なすぎます: {len(reader.pages)}"
          print(f"日本語PDF検査成功: {len(reader.pages)}ページ / {len(chapters)}章 / 110学習順 / 9概要 / 22復習 / {pdf_path.stat().st_size} bytes")
          PY
      # ユーザーが2026-10-29に明示承認した一回限りの教材PDF公開。
      # Draft PRは解除せず、正式版・既存Previewを更新しない。
      - name: 一回限りの検証済み教材PDFスナップショット公開
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 39 &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tag="learning-textbook-v3-snapshot-20261029"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "一回限りのPDFは公開済み。再発行・上書きをしません。"
            exit 0
          fi
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/39" --jq '.head.sha')"
          if [[ "$current_head" != "$SOURCE_SHA" ]]; then
            echo "::error::PRの先端が変化したため旧HEADの公開を拒否します。"
            exit 1
          fi
          # 別Workflowの同じソースHEADでWindows・Ubuntu実Chrome・PG18が全成功するまで公開しない。
          app_run_id=""
          for attempt in {1..45}; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=pull_request&per_page=100")"
            app_run_id="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "日本語Blazorアプリのビルドと画面疎通" and .head_sha == env.SOURCE_SHA)][0].id // empty')"
            conclusion="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "日本語Blazorアプリのビルドと画面疎通" and .head_sha == env.SOURCE_SHA)][0].conclusion // "pending"')"
            if [[ "$conclusion" == "success" && -n "$app_run_id" ]]; then
              break
            fi
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" ]]; then
              echo "::error::同一HEADアプリCIが$conclusion。PDFの公開を拒否します。"
              exit 1
            fi
            sleep 20
          done
          if [[ "$conclusion" != "success" || -z "$app_run_id" ]]; then
            echo "::error::同一HEADアプリCI成功を確認できません。"
            exit 1
          fi
          # ジョブ名・件数・成功を独立検査し、部分成功や別HEADの結果を流用しない。
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$app_run_id/jobs?per_page=100")"
          printf '%s' "$jobs" | jq -e '([.jobs[] | select(.status == "completed" and .conclusion == "success") | .name] | sort) == (["PostgreSQL 18 実DB結合テスト","ubuntu-24.04 Releaseビルド","windows-2025 Releaseビルド"] | sort)' >/dev/null
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/39" --jq '.head.sha')"
          if [[ "$current_head" != "$SOURCE_SHA" ]]; then
            echo "::error::公開直前にPR先端が変化したため拒否します。"
            exit 1
          fi
          # 固定の専用タグを一回だけ作る。既存のRelease・Assetは変更しない。
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "別のジョブによって同じスナップショットが公開済み。上書きしません。"
            exit 0
          fi
          gh release create "$tag" dist/blazor_learning_textbook_ja.pdf \
            --target "$SOURCE_SHA" \
            --title "Blazor実践学習テキスト v3（2026-10-29 検証済みスナップショット）" \
            --notes "Draft PR #39の同一HEADアプリ3ジョブ・PDFソース検査成功を条件とした一回限りの教材PDF。生成元HEAD: $SOURCE_SHA。現地PRE/SITEは未受入。正式learning-textbookと既存Previewは変更なし。" \
            --prerelease --latest=false
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx blazor_learning_textbook_ja.pdf

      # 教材v3はDraft PRで検証中のため、既存の正式教材Releaseには上書きしない。
      # 同一リポジトリの専用PRとアプリCI全成功を満たした場合のみプレビュー版を配布する。
      - name: 検証済み教材v3のPDFをプレビューReleaseへ反映
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'docs/curriculum-v2-winforms-dapper-roadmap'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # PDFだけでなくWindows/Linux/Chrome/実DBのアプリCI成功も必須条件とする。
          # 他のHEADの成功Runを流用しない。失敗した場合は公開せず停止する。
          app_result="pending"
          for attempt in {1..36}; do
            app_result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "日本語Blazorアプリのビルドと画面疎通" and .event == "pull_request")][0].conclusion // "pending"')"
            if [[ "$app_result" == "success" ]]; then
              break
            fi
            if [[ "$app_result" == "failure" || "$app_result" == "cancelled" || "$app_result" == "timed_out" ]]; then
              echo "::error::アプリCIが $app_result のため、プレビューPDFを公開しません。"
              exit 1
            fi
            sleep 20
          done
          if [[ "$app_result" != "success" ]]; then
            echo "::error::同一HEADのアプリCI成功が確認できませんでした。"
            exit 1
          fi
          # 前のHEADの遅延CIが現在のプレビューを上書きしないようにする。
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/36" --jq '.head.sha')"
          if [[ "$SOURCE_SHA" != "$current_head" ]]; then
            echo "新HEADが存在するため古いPDFの公開を省略します。"
            exit 0
          fi
          # 公開済みPreviewのPDFファイル名を固定し、ZIP化を避ける。
          tag="learning-textbook-v3-preview"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" \
              --title "Blazor実践学習テキスト v3（作成中プレビュー）" \
              --notes "Draft PR #36の検証済み教材プレビュー。完成版ではありません。生成元: $SOURCE_SHA" \
              --prerelease --latest=false
          fi
          gh release upload "$tag" dist/blazor_learning_textbook_ja.pdf --clobber
          gh release edit "$tag" --prerelease --latest=false \
            --notes "Draft PR #36の学習用プレビュー。Windows/Linux/Chrome/PostgreSQL18/PDF検査成功。生成元コミット: $SOURCE_SHA"
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx blazor_learning_textbook_ja.pdf
      # Actions Artifactは自動でZIPになるため学習者配布に使用しない。
      # mainの成功ビルドだけを直接PDFのRelease assetとして公開する。
      - name: PDFをZIP化せずGitHub Releaseで配布
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view learning-textbook >/dev/null 2>&1; then
            gh release create learning-textbook --target "$GITHUB_SHA" \
              --title "Blazor実践学習テキスト（PDF単体・最新版）" \
              --notes "最新mainの検査済み日本語PDFをZIP化せず提供します。" \
              --latest=false
          fi
          gh release upload learning-textbook dist/blazor_learning_textbook_ja.pdf --clobber
          gh release edit learning-textbook \
            --notes "日本語PDF単体配布。PDFの生成元コミット: $GITHUB_SHA" \
            --latest=false
          gh release view learning-textbook --json assets --jq '.assets[].name' | grep -Fx 'blazor_learning_textbook_ja.pdf'
